<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="glowOnly"/>
      <feMerge>
        <feMergeNode in="glowOnly"/>
        <feMergeNode in="glowOnly"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bgGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="100" fill="#0B0B1A"/>

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="160" fill="#6C5CE7" opacity="0.08" filter="url(#bgGlow)"/>

  <!-- Corner decorative tech accents -->
  <g opacity="0.3">
    <path d="M 70 70 L 110 70 M 70 70 L 70 110" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 442 442 L 402 442 M 442 442 L 442 402" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 70 442 L 110 442 M 70 442 L 70 402" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 442 70 L 402 70 M 442 70 L 442 110" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Junction dot accents -->
  <circle cx="140" cy="132" r="5" fill="url(#dotGrad)" opacity="0.6"/>
  <circle cx="300" cy="380" r="5" fill="url(#dotGrad)" opacity="0.6"/>
  <circle cx="390" cy="132" r="4" fill="url(#dotGrad)" opacity="0.4"/>
  <circle cx="370" cy="250" r="3" fill="#00D2FF" opacity="0.4"/>

  <!-- NF Monogram with neon glow -->
  <g filter="url(#glow)">
    <!-- N: left vertical → diagonal → right vertical (shared with F as stem) -->
    <path d="M 140 380 L 140 132 L 300 380 L 300 132"
          stroke="url(#nfGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- F: top horizontal bar and center horizontal bar -->
    <path d="M 300 132 L 390 132 M 300 250 L 370 250"
          stroke="url(#nfGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
